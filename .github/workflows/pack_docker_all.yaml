---
name: "Pack/Container/All"

on:
  workflow_dispatch:

jobs:
  # L0
  call_pack_docker_base:
    permissions: "write-all"
    uses: "./.github/workflows/pack_docker_base.yaml"
    secrets: inherit
  # L1
  call_pack_docker_dev:
    needs:
      - "call_pack_docker_base"
    permissions: "write-all"
    uses: "./.github/workflows/pack_docker_dev.yaml"
    secrets: inherit
  call_pack_docker_ansible_test:
    needs:
      - "call_pack_docker_base"
    permissions: "write-all"
    uses: "./.github/workflows/pack_docker_ansible_test.yaml"
    secrets: inherit
  call_pack_docker_bash_test:
    needs:
      - "call_pack_docker_base"
    permissions: "write-all"
    uses: "./.github/workflows/pack_docker_bash_test.yaml"
    secrets: inherit
  call_pack_docker_toolbox:
    needs:
      - "call_pack_docker_base"
    permissions: "write-all"
    uses: "./.github/workflows/pack_docker_toolbox.yaml"
    secrets: inherit
  # L2
  call_pack_docker_container_lint:
    needs:
      - "call_pack_docker_base"
    permissions: "write-all"
    uses: "./.github/workflows/pack_docker_container_lint.yaml"
    secrets: inherit
  call_pack_docker_go_test:
    needs:
      - "call_pack_docker_base"
    permissions: "write-all"
    uses: "./.github/workflows/pack_docker_go_test.yaml"
    secrets: inherit
  call_pack_docker_k8s_lint:
    needs:
      - "call_pack_docker_base"
    permissions: "write-all"
    uses: "./.github/workflows/pack_docker_k8s_lint.yaml"
    secrets: inherit
  call_pack_docker_pen_test:
    needs:
      - "call_pack_docker_base"
    permissions: "write-all"
    uses: "./.github/workflows/pack_docker_pen_test.yaml"
    secrets: inherit
  call_pack_docker_shell_lint:
    needs:
      - "call_pack_docker_base"
    permissions: "write-all"
    uses: "./.github/workflows/pack_docker_shell_lint.yaml"
    secrets: inherit
  call_pack_docker_ssg_lint:
    needs:
      - "call_pack_docker_base"
    permissions: "write-all"
    uses: "./.github/workflows/pack_docker_ssg_lint.yaml"
    secrets: inherit
  call_pack_docker_terraform_lint:
    needs:
      - "call_pack_docker_base"
    permissions: "write-all"
    uses: "./.github/workflows/pack_docker_terraform_lint.yaml"
    secrets: inherit
  call_pack_docker_terraform_test:
    needs:
      - "call_pack_docker_base"
    permissions: "write-all"
    uses: "./.github/workflows/pack_docker_terraform_test.yaml"
    secrets: inherit
  call_pack_docker_yaml_lint:
    needs:
      - "call_pack_docker_base"
    permissions: "write-all"
    uses: "./.github/workflows/pack_docker_yaml_lint.yaml"
    secrets: inherit
  call_pack_docker_cli:
    needs:
      - "call_pack_docker_base"
    permissions: "write-all"
    uses: "./.github/workflows/pack_docker_cli.yaml"
    secrets: inherit
...
